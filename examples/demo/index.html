<!DOCTYPE html>
<html>
<head>
    <title>Visual Audio Player</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./script.ts"></script>
</head>
<body>
    <label for="db-audio-toggle" title="Allows for convenient loading of previous audio files">
        Toggle Audio File Database storage
        <input id="db-audio-toggle" type="checkbox">
    </label>
    <input id="audio-input" type="file" accept="audio/*">
    <audio id="music" controls></audio>
    <canvas id="visualizer"></canvas>
</body>
</html>
